<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Escape — Evacuation Route Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect x="4" y="5" width="13" height="22" fill="none" stroke="#fff" stroke-width="2.4"/>
          <path d="M12 16h15m-5-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1 data-i18n="appTitle">Smart Escape</h1>
        <p data-i18n="appSubtitle"></p>
      </div>
    </div>
    <button id="langBtn" class="btn lang" type="button"></button>
  </header>

  <main class="layout">
    <section class="panel controls" aria-labelledby="dataTitle">
      <h2 id="dataTitle" data-i18n="dataTitle"></h2>
      <div class="btn-row">
        <button id="importBtn" class="btn primary" type="button" data-i18n="importBtn"></button>
        <button id="sampleBtn" class="btn" type="button" data-i18n="sampleBtn"></button>
      </div>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
      <div id="errorBox" class="error-box" role="alert" hidden></div>

      <h2 data-i18n="modeTitle"></h2>
      <div class="segmented" role="group">
        <button type="button" class="seg" data-mode="start" aria-pressed="true" data-i18n="modeStart"></button>
        <button type="button" class="seg" data-mode="hazard" aria-pressed="false" data-i18n="modeHazard"></button>
      </div>
      <p id="modeHint" class="hint"></p>
      <button id="resetBtn" class="btn reset" type="button" data-i18n="resetBtn" disabled></button>

      <h2 data-i18n="legendTitle"></h2>
      <ul class="legend">
        <li><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="#fff" stroke="#16202B" stroke-width="2"/></svg><span data-i18n="lgRoom"></span></li>
        <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#E9EDF1" stroke="#16202B" stroke-width="2"/></svg><span data-i18n="lgJunction"></span></li>
        <li><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2" fill="#00843D"/></svg><span data-i18n="lgExit"></span></li>
        <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#0B57D0" stroke-width="3"/></svg><span data-i18n="lgStart"></span></li>
        <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#C8231B"/></svg><span data-i18n="lgBlocked"></span></li>
        <li><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2" fill="#8A949E" stroke="#C8231B" stroke-width="2" stroke-dasharray="4 3"/></svg><span data-i18n="lgClosed"></span></li>
        <li><svg viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12" stroke="#C8231B" stroke-width="3" stroke-dasharray="4 4"/></svg><span data-i18n="lgBlockedEdge"></span></li>
        <li><svg viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12" stroke="#0B57D0" stroke-width="5" stroke-linecap="round"/></svg><span data-i18n="lgRoute"></span></li>
      </ul>
    </section>

    <section class="panel map-wrap">
      <div class="map-head" id="mapHead" hidden>
        <strong id="buildingName"></strong>
        <span id="buildingStats" class="muted"></span>
      </div>
      <div id="emptyState" class="empty">
        <p class="empty-title" data-i18n="emptyTitle"></p>
        <p class="muted" data-i18n="emptyText"></p>
        <div class="btn-row center">
          <button id="importBtn2" class="btn primary" type="button" data-i18n="importBtn"></button>
          <button id="sampleBtn2" class="btn" type="button" data-i18n="sampleBtn"></button>
        </div>
      </div>
      <svg id="map" viewBox="0 0 1000 640" role="img" hidden></svg>
    </section>

    <section class="panel result" aria-live="polite">
      <h2 data-i18n="routeTitle"></h2>
      <div id="statusBox"></div>
      <h2 data-i18n="hazardsTitle"></h2>
      <div id="hazardList"></div>
    </section>
  </main>

  <footer class="foot" data-i18n="footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
