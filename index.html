<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24356F">
<meta name="description" content="Deshi Bazar — handmade clothing and crafts from Bangladesh, delivered nationwide.">
<title>দেশি বাজার | Deshi Bazar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#app" class="skip-link" id="skipLink" onclick="event.preventDefault();document.getElementById('app').focus()">Skip to content</a>

<header class="hdr" id="hdr">
  <div class="wrap hdr-top">
    <button class="icon-btn menu-btn" id="menuBtn" onclick="openPanel('sideMenu')" aria-controls="sideMenu">
      <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a href="#home" class="logo" aria-label="Deshi Bazar home">
      <svg id="logoMark" class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#24356F"/><circle cx="20" cy="20" r="11" fill="none" stroke="#E8A317" stroke-width="2.4" stroke-dasharray="4 3"/><path d="M14 20h12M20 14v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span class="logo-words"><span id="logoText">দেশি বাজার</span><small id="logoSub"></small></span>
    </a>
    <form class="search" role="search" onsubmit="submitSearch(event)">
      <input id="q" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg"
             oninput="onSearchInput()" onkeydown="onSearchKey(event)" onfocus="onSearchInput()">
      <button class="search-btn" id="searchSubmit" type="submit">
        <svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      </button>
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </form>
    <div class="hdr-actions">
      <button class="lang-btn" id="langBtn" onclick="toggleLang()"></button>
      <a href="#wishlist" class="icon-btn hide-mobile" id="wishLink">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="badge" data-badge="wish" hidden></span>
      </a>
      <a href="#cart" class="icon-btn" id="cartLink">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 11.6a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21.5 7.5H6"/></svg>
        <span class="badge" data-badge="cart" hidden></span>
      </a>
    </div>
  </div>
  <nav class="catbar" id="catbar" aria-label="Categories"></nav>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="site-footer" id="footer"></footer>

<nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>

<div class="scrim" id="scrim" onclick="closePanels()"></div>
<aside class="drawer drawer-left" id="sideMenu" aria-hidden="true" aria-label="Menu"></aside>
<aside class="drawer drawer-right" id="miniCart" aria-hidden="true" aria-label="Cart"></aside>
<div id="modalRoot"></div>
<div id="toast" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
